import groovy.json.JsonSlurper
import java.util.zip.ZipFile

pluginManagement {
	repositories {
		mavenLocal()
		mavenCentral()
		gradlePluginPortal()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'KikuGie Snapshots'
			url = 'https://maven.kikugie.dev/snapshots'
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'dev.kikugie.stonecutter' version '0.9.4'
}

apply from: 'gradle/release-versions.gradle'

List<String> stonecutterMinecraftVersions = ext.stonecutterMinecraftVersions as List<String>
List<List<String>> releaseMinecraftVersionSets = ext.releaseMinecraftVersionSets as List<List<String>>
List<String> releaseBuildMinecraftVersions = ext.releaseBuildMinecraftVersions as List<String>
String[] stonecutterMinecraftVersionArray = stonecutterMinecraftVersions as String[]
def stonecutterVcsVersion = '1.20.1'

stonecutter.create(getRootProject()) {
	versions(stonecutterMinecraftVersionArray)
	vcsVersion = stonecutterVcsVersion
}

rootProject.name = 'Fresh_Armor_Bar'

gradle.rootProject { root ->
	gradle.projectsEvaluated {
		def activeMinecraftVersion = stonecutter.current.version

		root.tasks.register('minecraftClient') {
			group = 'Minecraft Client'
			description = "Runs the Fabric client for the active Stonecutter version (${activeMinecraftVersion})."
			dependsOn(root.project(":${activeMinecraftVersion}").tasks.named('runClient'))
		}

		def cleanCollectedJars = root.tasks.register('cleanCollectedJars', Delete) {
			group = 'build'
			description = 'Deletes collected release jars from build/libs.'
			delete(root.layout.buildDirectory.dir('libs'))
		}

		def verifyAllVersions = root.tasks.register('verifyAllVersions') {
			group = 'verification'
			description = 'Builds every configured Stonecutter target to verify compatibility.'
			dependsOn(stonecutterMinecraftVersions.collect { version ->
				root.project(":${version}").tasks.named('build')
			})
		}

		def releaseBuildTasks = releaseBuildMinecraftVersions.collect { version ->
			def releaseProject = root.project(":${version}")
			releaseProject.tasks.matching {
				it.name in ['jar', 'remapJar', 'sourcesJar', 'remapSourcesJar']
			}.configureEach {
				mustRunAfter(cleanCollectedJars)
			}
			releaseProject.tasks.named('build')
		}

		root.tasks.register('releaseBuild') {
			group = 'build'
			description = 'Cleans build/libs, then builds only the targets that produce release artifacts.'
			dependsOn(cleanCollectedJars)
			dependsOn(releaseBuildTasks)
		}

		Closure<String> compactVersionRange = { List<String> versions ->
			def first = versions.first()
			def last = versions.last()
			def firstParts = first.split('\\.')
			def lastParts = last.split('\\.')
			def commonPartCount = 0
			while (commonPartCount < firstParts.length
					&& commonPartCount < lastParts.length
					&& firstParts[commonPartCount] == lastParts[commonPartCount]) {
				commonPartCount++
			}
			def dropCount = firstParts.length == lastParts.length
					? commonPartCount
					: Math.max(0, commonPartCount - 1)
			def lastUniquePart = lastParts.drop(dropCount).join('.')
			lastUniquePart.isEmpty() ? first : "${first}-${lastUniquePart}"
		}

		Closure<String> expectedReleaseSuffix = { List<String> versions ->
			versions.size() > 1 ? compactVersionRange(versions) : versions.first()
		}

		Closure<Map> readFabricModJson = { File jarFile ->
			ZipFile zip = new ZipFile(jarFile)
			try {
				def entry = zip.getEntry('fabric.mod.json')
				if (entry == null) {
					throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
				}
				def input = zip.getInputStream(entry)
				try {
					return new JsonSlurper().parse(input) as Map
				} finally {
					input.close()
				}
			} finally {
				zip.close()
			}
		}

		Closure<Void> assertMinecraftDependency = { Object actual, List<String> expected, String context ->
			if (expected.size() == 1) {
				def expectedSingle = "~${expected.first()}"
				if (actual != expectedSingle) {
					throw new GradleException("${context}: expected minecraft ${expectedSingle}, found ${actual}")
				}
			} else if (actual != expected) {
				throw new GradleException("${context}: expected minecraft ${expected}, found ${actual}")
			}
			null
		}

		def validateReleaseArtifacts = root.tasks.register('validateReleaseArtifacts') {
			group = 'verification'
			description = 'Validates collected release jars, filenames and generated fabric.mod.json metadata.'
			dependsOn(root.tasks.named('releaseBuild'))
			mustRunAfter(verifyAllVersions)

			doLast {
				def libsDir = root.layout.buildDirectory.dir('libs').get().asFile
				def modVersion = root.findProperty('mod_version').toString()
				def loaderVersion = root.findProperty('loader_version').toString()
				def expectedFiles = [] as Set

				releaseMinecraftVersionSets.each { List<String> versions ->
					def suffix = expectedReleaseSuffix(versions)
					def artifactVersion = "${modVersion}-${suffix}"
					def jarName = "FreshArmorBar-${artifactVersion}.jar"
					def sourcesName = "FreshArmorBar-${artifactVersion}-sources.jar"
					expectedFiles << jarName
					expectedFiles << sourcesName

					def jarFile = new File(libsDir, jarName)
					def sourcesFile = new File(libsDir, sourcesName)
					if (!jarFile.isFile()) {
						throw new GradleException("Missing release jar: ${jarName}")
					}
					if (!sourcesFile.isFile()) {
						throw new GradleException("Missing release sources jar: ${sourcesName}")
					}

					def metadata = readFabricModJson(jarFile)
					if (metadata.version != artifactVersion) {
						throw new GradleException("${jarName}: expected version ${artifactVersion}, found ${metadata.version}")
					}
					if (metadata.depends?.fabricloader != ">=${loaderVersion}") {
						throw new GradleException("${jarName}: expected fabricloader >=${loaderVersion}, found ${metadata.depends?.fabricloader}")
					}
					if (metadata.depends?.containsKey('fabric-api')) {
						throw new GradleException("${jarName}: fabric-api must not be a hard dependency")
					}
					if (metadata.suggests?.containsKey('fabric-api')) {
						throw new GradleException("${jarName}: fabric-api must not be suggested")
					}
					assertMinecraftDependency(metadata.depends?.minecraft, versions, jarName)
				}

				def actualFiles = libsDir.listFiles({ File file -> file.name.endsWith('.jar') } as FileFilter)
						.collect { it.name } as Set
				def unexpectedFiles = actualFiles - expectedFiles
				if (!unexpectedFiles.isEmpty()) {
					throw new GradleException("Unexpected jar(s) in build/libs: ${unexpectedFiles.sort()}")
				}
			}
		}

		root.tasks.register('fullVerify') {
			group = 'verification'
			description = 'Runs all compatibility and release validation checks in a stable order.'
			dependsOn(verifyAllVersions)
			dependsOn(validateReleaseArtifacts)
		}
	}
}
