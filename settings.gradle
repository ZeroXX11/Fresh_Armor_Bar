pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'KikuGie Releases'
			url = 'https://maven.kikugie.dev/releases'
		}
		maven {
			name = 'KikuGie Snapshots'
			url = 'https://maven.kikugie.dev/snapshots'
		}
		mavenCentral()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'dev.kikugie.stonecutter' version '0.9'
}

def stonecutterVersions = ['1.20.1', '1.21.1']
def stonecutterVcsVersion = '1.20.1'

stonecutter.create(getRootProject()) {
	versions(*stonecutterVersions)
	vcsVersion = stonecutterVcsVersion
}

rootProject.name = 'Fresh_Armor_Bar'

gradle.rootProject { root ->
	gradle.projectsEvaluated {
		def stonecutterSourceTaskPairs = [
				['stonecutterPrepare', 'stonecutterGenerate', 'stonecutterMerge'],
				['stonecutterPrepareClient', 'stonecutterGenerateClient', 'stonecutterMergeClient'],
				['stonecutterPrepareTest', 'stonecutterGenerateTest', 'stonecutterMergeTest']
		]

		def nonVcsStonecutterVersions = stonecutterVersions.findAll { it != stonecutterVcsVersion }
		def stonecutterTask = { String projectPath, String taskName ->
			def targetProject = root.project(projectPath)
			targetProject.tasks.names.contains(taskName) ? targetProject.tasks.named(taskName) : null
		}

		nonVcsStonecutterVersions.each { nonVcsVersion ->
			stonecutterSourceTaskPairs.each { taskNames ->
				def nonVcsPrepareTask = stonecutterTask(":${nonVcsVersion}", taskNames[0])
				def vcsGenerateTask = stonecutterTask(":${stonecutterVcsVersion}", taskNames[1])
				def vcsMergeTask = stonecutterTask(":${stonecutterVcsVersion}", taskNames[2])
				def nonVcsMergeTask = stonecutterTask(":${nonVcsVersion}", taskNames[2])

				if (nonVcsPrepareTask != null && vcsMergeTask != null) {
					nonVcsPrepareTask.configure {
						mustRunAfter(vcsMergeTask)
					}
				}

				if (vcsGenerateTask != null && nonVcsMergeTask != null) {
					vcsGenerateTask.configure {
						mustRunAfter(nonVcsMergeTask)
					}
				}
			}
		}

		def registerClientLauncher = { String taskName, String minecraftVersion ->
			def switchTask = root.tasks.named("stonecutterSwitchTo${minecraftVersion}")
			def runClientTask = root.project(":${minecraftVersion}").tasks.named('runClient')

			runClientTask.configure {
				mustRunAfter(switchTask)
			}

			root.tasks.register(taskName) {
				group = 'Minecraft Client'
				description = "Switches Stonecutter to Minecraft ${minecraftVersion}, then runs the Fabric client."
				dependsOn(switchTask)
				dependsOn(runClientTask)
			}
		}

		registerClientLauncher('client1_20_1', '1.20.1')
		registerClientLauncher('client1_21_1', '1.21.1')
	}
}
