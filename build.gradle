import org.gradle.api.plugins.BasePluginExtension
import org.gradle.api.publish.PublishingExtension
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.language.jvm.tasks.ProcessResources

plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

extensions.getByType(BasePluginExtension).archivesName.set("${project.archives_base_name}-${stonecutter.current.version}")

repositories {
    // I repository essenziali per Minecraft vengono aggiunti automaticamente da Loom.
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = "https://maven.ladysnake.org/releases"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "fresh-armor-bar" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
    }
}

sourceSets.main.resources.exclude("fabric.mod.json")

tasks.named("compileJava").configure {
    dependsOn(tasks.named("stonecutterMerge"))
}

tasks.named("compileClientJava").configure {
    dependsOn(tasks.named("stonecutterMergeClient"))
}

tasks.named("processResources").configure {
    dependsOn(tasks.named("stonecutterMerge"))
}

tasks.named("processClientResources").configure {
    dependsOn(tasks.named("stonecutterMergeClient"))
}

tasks.named("compileTestJava").configure {
    dependsOn(tasks.named("stonecutterMergeTest"))
}

tasks.named("processTestResources").configure {
    dependsOn(tasks.named("stonecutterMergeTest"))
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
    dependsOn(tasks.named("stonecutterMerge"))
    dependsOn(tasks.named("stonecutterMergeClient"))
}

tasks.named("stonecutterGenerate").configure {
    dependsOn(tasks.named("stonecutterMerge"))
}

tasks.named("stonecutterGenerateClient").configure {
    dependsOn(tasks.named("stonecutterMergeClient"))
}

tasks.named("stonecutterGenerateTest").configure {
    dependsOn(tasks.named("stonecutterMergeTest"))
}

dependencies {
    // --- Core Minecraft & Fabric ---
    // Le versioni sono gestite nel file gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // --- Fabric API ---
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // --- Mod Compatibility & APIs ---
    // Trinkets API
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"

    if (stonecutter.eval(stonecutter.current.version, ">=1.21")) {
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    }

    // --- Libraries & Utilities ---
    // MixinExtras
    modImplementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
}

def runtimeJavaVersion = 21
def targetJavaVersion = stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? 21 : 17
def fabricModJsonTemplate = rootProject.layout.projectDirectory.file("src/main/resources/fabric.mod.json")
def generatedFabricModJsonDir = layout.buildDirectory.dir("generated/resources/fabricModJson")
def fabricModJsonProps = [
        "version": project.version,
        "mod_name": project.mod_name,
        "minecraft_version": stonecutter.current.version,
        "loader_version": project.loader_version,
        "java_version": stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? 21 : 17
]

tasks.register("generateFabricModJson") {
    dependsOn(tasks.named("stonecutterMerge"))

    inputs.file(fabricModJsonTemplate)
    inputs.properties(fabricModJsonProps)
    outputs.file(generatedFabricModJsonDir.map { it.file("fabric.mod.json") })

    doLast {
        def outputFile = generatedFabricModJsonDir.get().file("fabric.mod.json").asFile
        outputFile.parentFile.mkdirs()

        def contents = fabricModJsonTemplate.asFile.getText("UTF-8")
        fabricModJsonProps.each { key, value ->
            contents = contents.replace("\${${key}}", value.toString())
        }

        outputFile.setText(contents, "UTF-8")
    }
}

tasks.named("processResources", ProcessResources).configure {
    dependsOn(tasks.named("generateFabricModJson"))
    inputs.properties(fabricModJsonProps)

    from(generatedFabricModJsonDir) {
        include("fabric.mod.json")
    }
}

// Configurazione Java (Metodo moderno con Toolchain)
java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(runtimeJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

extensions.getByType(PublishingExtension).publications.register("mavenJava", MavenPublication) { publication ->
    publication.artifactId = project.archives_base_name
    publication.from(components.java)
}

publishing {
    repositories {
        // Repository Maven per la pubblicazione (opzionale)
    }
}
