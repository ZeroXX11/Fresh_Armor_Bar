import org.gradle.api.publish.PublishingExtension
import org.gradle.api.publish.maven.MavenPublication
import groovy.text.SimpleTemplateEngine

plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // I repository essenziali per Minecraft vengono aggiunti automaticamente da Loom.
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = "https://maven.ladysnake.org/releases"
    }
}

loom {
    fabricModJsonPath = rootProject.file("src/main/resources/fabric.mod.json")

    mods {
        "fresh-armor-bar" {
            sourceSet(sourceSets.main)
        }
    }

    runConfigs.configureEach {
        ideConfigGenerated = false
        runDir = "../../run"
    }
}

dependencies {
    // --- Core Minecraft & Fabric ---
    // Le versioni sono gestite nel file gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // --- Fabric API ---
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // --- Mod Compatibility & APIs ---
    // Trinkets API
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"

    if (stonecutter.eval(stonecutter.current.version, ">=1.21")) {
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    }

    // --- Libraries & Utilities ---
    // MixinExtras
    modImplementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
}

def runtimeJavaVersion = 21
def targetJavaVersion = stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? 21 : 17
def fabricModJsonProps = [
        "version": project.version,
        "mod_name": project.mod_name,
        "minecraft_version": stonecutter.current.version,
        "loader_version": project.loader_version,
        "java_version": stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? 21 : 17
]

def generatedFabricModJson = layout.buildDirectory.dir("generated/resources/fabricModJson")
def generatedFabricModJsonFile = generatedFabricModJson.map { it.file("fabric.mod.json") }

tasks.register("generateFabricModJson") {
    def fabricModJsonTemplate = rootProject.file("src/main/resources/fabric.mod.json")

    inputs.file(fabricModJsonTemplate)
    inputs.properties(fabricModJsonProps)
    outputs.file(generatedFabricModJsonFile)

    doLast {
        def outputFile = generatedFabricModJsonFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = new SimpleTemplateEngine()
                .createTemplate(fabricModJsonTemplate)
                .make(fabricModJsonProps)
                .toString()
    }
}

tasks.named("processResources").configure {
    dependsOn(tasks.named("generateFabricModJson"))

    from(generatedFabricModJson) {
        include("fabric.mod.json")
    }

    eachFile { file ->
        if (file.name == "fabric.mod.json" && !file.file.toPath().startsWith(generatedFabricModJson.get().asFile.toPath())) {
            file.exclude()
        }
    }
}

// Configurazione Java (Metodo moderno con Toolchain)
java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(runtimeJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

tasks.register("buildAndCollect", Copy) {
    group = "build"
    description = "Builds this version and collects the remapped jar and sources jar in the root build/libs folder."
    dependsOn(tasks.named("build"))
    from(tasks.named("remapJar").map { it.archiveFile })
    from(tasks.named("remapSourcesJar").map { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir("libs/${project.mod_version}"))
}

extensions.getByType(PublishingExtension).publications.register("mavenJava", MavenPublication) { publication ->
    publication.artifactId = project.archives_base_name
    publication.from(components.java)
}

publishing {
    repositories {
        // Repository Maven per la pubblicazione (opzionale)
    }
}
