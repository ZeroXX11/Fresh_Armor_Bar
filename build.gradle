plugins {
    id 'fabric-loom' version '1.3.8'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // I repository essenziali per Minecraft vengono aggiunti automaticamente da Loom.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "fresh-armor-bar" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Le versioni sono gestite nel file gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (Consigliata)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // MixinExtras
    modImplementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

processResources {
    def expandProps = [
            "version": project.version,
            "mod_name": project.mod_name
    ]
    
    inputs.properties(expandProps)

    filesMatching("fabric.mod.json") {
        expand(expandProps)
    }
}

// Configurazione Java 17 (Metodo moderno con Toolchain)
def targetJavaVersion = 17
java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    
    repositories {
        // Repository Maven per la pubblicazione (opzionale)
    }
}