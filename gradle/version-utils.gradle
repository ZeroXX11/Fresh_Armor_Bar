ext.compactMinecraftVersionRange = { List<String> versions ->
    def first = versions.first()
    def last = versions.last()
    def firstParts = first.split('\\.')
    def lastParts = last.split('\\.')
    def commonPartCount = 0
    while (commonPartCount < firstParts.length
            && commonPartCount < lastParts.length
            && firstParts[commonPartCount] == lastParts[commonPartCount]) {
        commonPartCount++
    }
    def dropCount = firstParts.length == lastParts.length
            ? commonPartCount
            : Math.max(0, commonPartCount - 1)
    def lastUniquePart = lastParts.drop(dropCount).join('.')
    lastUniquePart.isEmpty() ? first : "${first}-${lastUniquePart}"
}
